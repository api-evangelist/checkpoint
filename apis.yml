aid: checkpoint
name: Check Point
description: >-
  Check Point Software Technologies is a global cybersecurity vendor providing network, cloud, endpoint, mobile, and
  email security through its Quantum, CloudGuard, and Harmony product families. Check Point exposes a wide range of REST
  APIs for security automation, including the Smart-1 Management API, Gaia OS API, CloudGuard cloud security posture
  API, Identity Awareness API, Spark and Zero Touch device management APIs, Harmony Email and Collaboration API, Threat
  Hunting (TH) API, and CloudGuard WAF API.
accessModel:
  pricing: unknown
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
