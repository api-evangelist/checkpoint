openapi: 3.1.0
info:
  title: Check Point CloudGuard Access Rules Login API
  description: REST API for Check Point CloudGuard Native cloud security posture management. Manages cloud accounts, assets, security policies, and risk findings across AWS, Azure, and GCP environments.
  version: '1.0'
  contact:
    name: Check Point CloudGuard Support
    url: https://docs.cgn.portal.checkpoint.com/
servers:
- url: https://api.dome9.com/v2
  description: CloudGuard Production
security:
- basicAuth: []
tags:
- name: Login
paths:
  /login:
    post:
      operationId: gaiaLogin
      summary: Login to Gaia
      tags:
      - Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user
              - password
              properties:
                user:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Session
  /logout:
    post:
      operationId: logout
      summary: Logout the current session
      tags:
      - Login
      responses:
        '200':
          description: Logout successful
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
