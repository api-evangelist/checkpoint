openapi: 3.2.0
info:
  title: Checkpoint Login API
  contact:
    name: Check Point Support
    url: https://www.checkpoint.com/support-services/
  version: '1.0'
  description: 'Operations tagged Login across 2 of this provider''s published API definitions: checkpoint-gaia-api-openapi.yml, checkpoint-management-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{gateway}/gaia_api
  description: Gaia REST API
  variables:
    gateway:
      default: gateway.example.com
- url: https://{server}/web_api
  description: Smart-1 Management Server
  variables:
    server:
      default: management.example.com
security:
- sidToken: []
tags:
- name: Login
paths:
  /login:
    post:
      operationId: gaiaLogin
      summary: Login to Gaia
      tags:
      - Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user
              - password
              properties:
                user:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Session
    servers:
    - url: https://{gateway}/gaia_api
      description: Gaia REST API
      variables:
        gateway:
          default: gateway.example.com
  /logout:
    post:
      operationId: logout
      summary: Logout the current session
      tags:
      - Login
      responses:
        '200':
          description: Logout successful
    servers:
    - url: https://{server}/web_api
      description: Smart-1 Management Server
      variables:
        server:
          default: management.example.com
components:
  securitySchemes:
    sidToken:
      type: apiKey
      in: header
      name: X-chkp-sid
x-refined-from:
- checkpoint-gaia-api-openapi.yml
- checkpoint-management-api-openapi.yml
