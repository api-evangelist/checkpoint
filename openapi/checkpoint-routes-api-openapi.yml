openapi: 3.2.0
info:
  title: Check Point Gaia Routes API
  description: REST API for the Check Point Gaia operating system. Allows administrators to manage gateway interfaces, routing, and system configuration through automation.
  version: '1.8'
  contact:
    name: Check Point Support
    url: https://www.checkpoint.com/support-services/
servers:
- url: https://{gateway}/gaia_api
  description: Gaia REST API
  variables:
    gateway:
      default: gateway.example.com
security:
- sidToken: []
tags:
- name: Routes
paths:
  /show-static-routes:
    post:
      operationId: showStaticRoutes
      summary: Show static routes
      tags:
      - Routes
      responses:
        '200':
          description: Static routes
components:
  securitySchemes:
    sidToken:
      type: apiKey
      in: header
      name: X-chkp-sid
externalDocs:
  description: Gaia API Reference
  url: https://sc1.checkpoint.com/documents/latest/GaiaAPIs/
