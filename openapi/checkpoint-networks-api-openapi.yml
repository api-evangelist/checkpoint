openapi: 3.2.0
info:
  title: Check Point Management Networks API
  description: REST API for the Check Point Smart-1 Security Management Server. Allows automation of policy and object management including network and host objects, services, security policies, access rules, NAT rules, and publish/install operations.
  version: '2.0'
  contact:
    name: Check Point Support
    url: https://www.checkpoint.com/support-services/
servers:
- url: https://{server}/web_api
  description: Smart-1 Management Server
  variables:
    server:
      default: management.example.com
security:
- sidToken: []
tags:
- name: Networks
paths:
  /show-networks:
    post:
      operationId: showNetworks
      summary: Show network objects
      tags:
      - Networks
      responses:
        '200':
          description: Networks list
components:
  securitySchemes:
    sidToken:
      type: apiKey
      in: header
      name: X-chkp-sid
      description: Session ID issued by /login.
externalDocs:
  description: Check Point Management API Reference
  url: https://sc1.checkpoint.com/documents/latest/APIs/
